<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Board</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-touch-icon" href="icon-192.png" />
  <meta name="theme-color" content="#2c3e50" />

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header>
  <h1>Task Board</h1>

  <select id="sortMode">
    <option value="type" selected>編集 / 執筆</option>
    <option value="genre">動画 / 物語</option>
  </select>

  <button type="button" id="syncButton">同期</button>
  <button type="button" id="settingsButton">設定</button>
</header>

<div id="syncStatus">未同期</div>

<nav class="tabs">
  <button id="tab-inprogress" type="button">進行中</button>
  <button id="tab-preparing" type="button">準備中</button>
</nav>

<section id="taskContainer"></section>

<button class="fab" type="button" id="openFormButton">＋</button>

<!-- タスク編集モーダル -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <form id="taskForm">
      <input type="hidden" id="taskId" />

      <input
        type="text"
        id="title"
        placeholder="タスク名"
        required
      />

      <div>
        <label>
          <input type="radio" name="type" value="編集" checked />
          編集
        </label>

        <label>
          <input type="radio" name="type" value="執筆" />
          執筆
        </label>
      </div>

      <div>
        <label>
          <input type="radio" name="genre" value="動画" checked />
          動画
        </label>

        <label>
          <input type="radio" name="genre" value="物語" />
          物語
        </label>
      </div>

      <select id="status">
        <option value="inprogress">進行中</option>
        <option value="preparing">準備中</option>
      </select>

      <div class="modal-buttons">
        <button type="submit">保存</button>
        <button type="button" id="cancelTaskButton">キャンセル</button>
      </div>
    </form>
  </div>
</div>

<!-- APIキー設定モーダル -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <h2>同期設定</h2>

    <p>
      Cloudflareに登録したAPIキーを入力してください。
      このブラウザでは一度保存すれば、以後は自動で使われます。
    </p>

    <form id="settingsForm">
      <input
        type="password"
        id="apiKeyInput"
        placeholder="APIキー"
        autocomplete="off"
        required
      />

      <div class="modal-buttons">
        <button type="submit">保存して同期</button>
        <button type="button" id="cancelSettingsButton">
          キャンセル
        </button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
</body>
</html>
